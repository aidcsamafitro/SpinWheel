<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakarta Running Festival - Spin & Win</title>
  <style>
    :root {
      --jrf-navy: #0B192C;
      --jrf-orange: #FF6500;
      --jrf-dark-blue: #1E3E62;
      --jrf-gold: #FFD700;
      --jrf-light: #F8F9FA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--jrf-navy) 0%, var(--jrf-dark-blue) 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Track Lines Background Effect */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(255, 101, 0, 0.05) 40px,
        rgba(255, 101, 0, 0.05) 80px
      );
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    .header-logo {
      text-align: center;
      margin-bottom: 15px;
    }

    .header-logo h2 {
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: var(--jrf-orange);
      text-transform: uppercase;
      font-weight: 800;
    }

    .header-logo h1 {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
      line-height: 1.1;
    }

    .counter-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 101, 0, 0.4);
      margin-bottom: 20px;
      font-size: 1rem;
      font-weight: 600;
    }

    .counter-box span {
      color: var(--jrf-gold);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .wheel-outer {
      position: relative;
      padding: 12px;
      background: linear-gradient(145deg, var(--jrf-orange), #ff8533);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255, 101, 0, 0.4);
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
    }

    /* Penunjuk Roda (Pointer) */
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #ffffff;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      z-index: 10;
    }

    canvas {
      border-radius: 50%;
      transition: transform 5s cubic-bezier(0.15, 0.99, 0.35, 1);
    }

    /* Center Cap */
    .center-cap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: var(--jrf-navy);
      border: 4px solid var(--jrf-gold);
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .spin-btn {
      margin-top: 25px;
      padding: 15px 45px;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      background: linear-gradient(45deg, var(--jrf-orange), #ff3300);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 101, 0, 0.5);
      transition: all 0.2s ease;
    }

    .spin-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255, 101, 0, 0.7);
    }

    .spin-btn:disabled {
      background: #555555;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* --- MODAL POPUP ZOOM HADIAH --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 25, 44, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: linear-gradient(135deg, #1E3E62 0%, #0B192C 100%);
      border: 3px solid var(--jrf-orange);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      max-width: 90%;
      width: 450px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(255, 101, 0, 0.3);
      transform: scale(0.3);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .prize-name {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--jrf-gold);
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
      margin: 15px 0;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .grand-prize-tag {
      display: inline-block;
      background: var(--jrf-orange);
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 5px 15px;
      border-radius: 20px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .close-btn {
      margin-top: 20px;
      padding: 12px 35px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--jrf-orange);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #e05500;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logo">
      <h2>OFFICIAL MERCHANDISE</h2>
      <h1>JAKARTA RUNNING FESTIVAL</h1>
    </div>

    <div class="counter-box">
      Total Spin: <span id="spinCount">0</span>
    </div>

    <div class="wheel-outer">
      <div class="wheel-container">
        <div class="pointer"></div>
        <div class="center-cap"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
      </div>
    </div>

    <button id="spinBtn" class="spin-btn" onclick="spin()">SPIN NOW</button>
  </div>

  <!-- POPUP ZOOM HADIAH -->
  <div class="modal-overlay" id="prizeModal">
    <div class="modal-content">
      <div id="badgeContainer"></div>
      <div class="modal-title">SELAMAT! ANDA MENAPATKAN</div>
      <div class="prize-name" id="modalPrizeName">HEADBAND</div>
      <button class="close-btn" onclick="closeModal()">AMBIL HADIAH</button>
    </div>
  </div>

  <script>
    // Data Hadiah & Warna Tema JRF
    const prizes = [
      { name: "Keychain", qty: 100, color: "#1E3E62", textColor: "#FFFFFF" },
      { name: "Keychain Botol", qty: 100, color: "#FF6500", textColor: "#FFFFFF" },
      { name: "Earset Lenovo", qty: 10, color: "#FFD700", textColor: "#0B192C", isGrand: true }, 
      { name: "Kaus Kaki", qty: 50, color: "#0B192C", textColor: "#FFFFFF" },
      { name: "Headband", qty: 50, color: "#FF6500", textColor: "#FFFFFF" },
      { name: "Handuk Sport", qty: 50, color: "#1E3E62", textColor: "#FFFFFF" },
      { name: "Running Vest", qty: 50, color: "#0B192C", textColor: "#FFFFFF" }
    ];

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const spinCountDisplay = document.getElementById('spinCount');
    const prizeModal = document.getElementById('prizeModal');
    const modalPrizeName = document.getElementById('modalPrizeName');
    const badgeContainer = document.getElementById('badgeContainer');

    let totalSpins = 0;
    let currentRotation = 0;
    const numSlices = prizes.length;
    const sliceAngle = (2 * Math.PI) / numSlices;

    // --- Web Audio API untuk Efek Suara ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.1);
        gain.gain.setValueAtTime(0.3, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.3);
      });
    }

    // Menggambar Wheel
    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // Draw Sector
        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, endAngle);
        ctx.fillStyle = prizes[i].color;
        ctx.fill();

        // Stroke Border
        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw Text
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = prizes[i].textColor;
        ctx.font = "bold 13px 'Montserrat', sans-serif";
        ctx.fillText(prizes[i].name, radius - 20, 5);
        ctx.restore();
      }
    }

    // Logika Pemilihan Hadiah (Earset Lenovo Tiap Kelipatan 50)
    function getPrizeIndex() {
      totalSpins++;
      spinCountDisplay.innerText = totalSpins;

      // Kelipatan 50 Spin = Grand Prize (Earset Lenovo -> Index 2)
      if (totalSpins % 50 === 0 && prizes[2].qty > 0) {
        prizes[2].qty--;
        return 2;
      }

      // Pilih acak selain Grand Prize
      const regularIndices = [0, 1, 3, 4, 5, 6].filter(i => prizes[i].qty > 0);
      
      if (regularIndices.length === 0) {
        const remainingIndices = prizes.map((p, i) => p.qty > 0 ? i : -1).filter(i => i !== -1);
        if (remainingIndices.length === 0) return -1; // Stok Habis
        const randomIndex = Math.floor(Math.random() * remainingIndices.length);
        const chosen = remainingIndices[randomIndex];
        prizes[chosen].qty--;
        return chosen;
      }

      const randomIndex = Math.floor(Math.random() * regularIndices.length);
      const chosenIndex = regularIndices[randomIndex];
      prizes[chosenIndex].qty--;
      return chosenIndex;
    }

    // Fungsi Spin
    function spin() {
      const winningIndex = getPrizeIndex();

      if (winningIndex === -1) {
        alert("Maaf, semua stok hadiah telah habis!");
        return;
      }

      spinBtn.disabled = true;

      // Kalkulasi Sudut Putaran
      const degreesPerSlice = 360 / numSlices;
      const targetDegree = 360 - (winningIndex * degreesPerSlice) - (degreesPerSlice / 2) - 90;
      const extraRounds = 360 * 6; // 6 Putaran penuh
      const nextRotation = currentRotation + extraRounds + ((targetDegree - (currentRotation % 360) + 360) % 360);
      
      // Simulasi Sound Ticking
      let soundInterval = setInterval(() => {
        playTickSound();
      }, 150);

      // Kurangi frekuensi suara secara perlahan
      setTimeout(() => {
        clearInterval(soundInterval);
        soundInterval = setInterval(() => { playTickSound(); }, 300);
      }, 3000);

      setTimeout(() => {
        clearInterval(soundInterval);
      }, 4500);

      currentRotation = nextRotation;
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      // Saat Spin Selesai
      setTimeout(() => {
        spinBtn.disabled = false;
        showPrizeModal(prizes[winningIndex]);
      }, 5000);
    }

    // Tampilkan Modal Zoom Hadiah
    function showPrizeModal(prize) {
      playWinSound();
      modalPrizeName.innerText = prize.name;

      if (prize.isGrand) {
        badgeContainer.innerHTML = `<span class="grand-prize-tag">🌟 GRAND PRIZE 🌟</span>`;
      } else {
        badgeContainer.innerHTML = ``;
      }

      prizeModal.classList.add('active');
    }

    function closeModal() {
      prizeModal.classList.remove('active');
    }

    // Inisialisasi awal
    drawWheel();
  </script>
</body>
</html>
```
