<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakarta Running Festival - Spin & Win</title>

  <style>
    :root {
      --jrf-navy: #0B192C;
      --jrf-orange: #FF6500;
      --jrf-dark-blue: #1E3E62;
      --jrf-gold: #FFD700;
      --jrf-light: #F8F9FA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--jrf-navy) 0%, var(--jrf-dark-blue) 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(255, 101, 0, 0.05) 40px,
        rgba(255, 101, 0, 0.05) 80px
      );
      z-index: 0;
      pointer-events: none;
    }

    .admin-trigger-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaa;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }

    .admin-trigger-btn:hover {
      background: var(--jrf-orange);
      color: #fff;
      border-color: var(--jrf-orange);
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    .header-logo {
      text-align: center;
      margin-bottom: 15px;
    }

    .header-logo h2 {
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: var(--jrf-orange);
      text-transform: uppercase;
      font-weight: 800;
    }

    .header-logo h1 {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.1;
    }

    .counter-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 101, 0, 0.4);
      margin-bottom: 20px;
      font-size: 1rem;
      font-weight: 600;
    }

    .counter-box span {
      color: var(--jrf-gold);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .wheel-outer {
      position: relative;
      padding: 12px;
      background: linear-gradient(145deg, var(--jrf-orange), #ff8533);
      border-radius: 50%;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 101, 0, 0.4);
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #fff;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
      z-index: 10;
    }

    canvas {
      display: block;
      border-radius: 50%;
      transition: transform 5s cubic-bezier(0.15, 0.99, 0.35, 1);
    }

    .center-cap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: var(--jrf-navy);
      border: 4px solid var(--jrf-gold);
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .spin-btn {
      margin-top: 25px;
      padding: 15px 45px;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(45deg, var(--jrf-orange), #ff3300);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 101, 0, 0.5);
      transition: all 0.2s ease;
    }

    .spin-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255, 101, 0, 0.7);
    }

    .spin-btn:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* POP-UP HADIAH */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 25, 44, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      overflow-y: auto;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: linear-gradient(135deg, #1E3E62 0%, #0B192C 100%);
      border: 3px solid var(--jrf-orange);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 500px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(255, 101, 0, 0.3);
      transform: scale(0.3);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    /* GAMBAR HADIAH DIPERBESAR */
    .prize-img-container {
      width: 320px;
      height: 320px;
      max-width: 100%;
      margin: 15px auto 18px;
      border-radius: 20px;
      border: 3px solid var(--jrf-gold);
      overflow: hidden;
      background: #0B192C;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prize-img-container img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    .modal-title {
      font-size: 1rem;
      letter-spacing: 2px;
      color: #ddd;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .prize-name {
      font-size: 2rem;
      font-weight: 900;
      color: var(--jrf-gold);
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
      margin: 10px 0;
      text-transform: uppercase;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .close-btn {
      margin-top: 15px;
      padding: 12px 35px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--jrf-orange);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #e05500;
    }

    /* PANEL ADMIN */
    .admin-modal-content {
      background: #0B192C;
      border: 2px solid var(--jrf-orange);
      border-radius: 20px;
      padding: 25px;
      max-width: 850px;
      width: 95%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .admin-header h3 {
      color: var(--jrf-gold);
      font-size: 1.3rem;
      text-transform: uppercase;
    }

    .btn-close-admin {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .form-control label {
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: #ccc;
    }

    .form-control input[type="text"],
    .form-control input[type="number"],
    .form-control input[type="color"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--jrf-dark-blue);
      background: #162a45;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    .form-control input[type="color"] {
      height: 38px;
      cursor: pointer;
      padding: 2px;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-add {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add:hover {
      background: #218838;
    }

    .btn-reset-default {
      background: #fd7e14;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-reset-default:hover {
      background: #e06d0e;
    }

    .prize-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.85rem;
    }

    .prize-table th,
    .prize-table td {
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .prize-table th {
      background: var(--jrf-dark-blue);
      color: var(--jrf-gold);
    }

    .action-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .btn-edit,
    .btn-delete {
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .btn-edit {
      background: #17a2b8;
    }

    .btn-edit:hover {
      background: #138496;
    }

    .btn-delete {
      background: #dc3545;
    }

    .btn-delete:hover {
      background: #c82333;
    }

    /* RESPONSIVE HP */
    @media (max-width: 600px) {
      .container {
        padding: 75px 12px 24px;
      }

      .header-logo h2 {
        font-size: 0.9rem;
        letter-spacing: 2px;
      }

      .header-logo h1 {
        font-size: 1.65rem;
      }

      .wheel-container {
        width: min(78vw, 360px);
        height: min(78vw, 360px);
      }

      #wheel {
        width: 100%;
        height: 100%;
      }

      .wheel-outer {
        padding: 8px;
      }

      .spin-btn {
        padding: 13px 35px;
        font-size: 1rem;
      }

      .admin-trigger-btn {
        top: 12px;
        right: 12px;
      }

      .modal-content {
        padding: 18px 14px;
        border-radius: 20px;
      }

      .prize-img-container {
        width: min(76vw, 280px);
        height: min(76vw, 280px);
        margin: 12px auto 15px;
        border-radius: 16px;
      }

      .prize-name {
        font-size: 1.6rem;
      }

      .modal-title {
        font-size: 0.85rem;
        letter-spacing: 1px;
      }

      .close-btn {
        padding: 11px 28px;
        font-size: 0.9rem;
      }

      .admin-modal-content {
        padding: 15px 10px;
      }

      .prize-table {
        font-size: 0.72rem;
      }

      .prize-table th,
      .prize-table td {
        padding: 5px 3px;
      }
    }

    @media (max-height: 650px) {
      .modal-content {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .prize-img-container {
        width: min(45vh, 260px);
        height: min(45vh, 260px);
        margin: 8px auto;
      }

      .prize-name {
        font-size: 1.5rem;
        margin: 6px 0;
      }

      .close-btn {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <button class="admin-trigger-btn" onclick="openAdminPanel()">
    ⚙️ Kelola Hadiah
  </button>

  <div class="container">
    <div class="header-logo">
      <h2>OFFICIAL MERCHANDISE</h2>
      <h1>JAKARTA RUNNING FESTIVAL</h1>
    </div>

    <div class="counter-box">
      Total Spin: <span id="spinCount">0</span>
    </div>

    <div class="wheel-outer">
      <div class="wheel-container">
        <div class="pointer"></div>
        <div class="center-cap"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
      </div>
    </div>

    <button id="spinBtn" class="spin-btn" onclick="spin()">
      SPIN NOW
    </button>
  </div>

  <!-- MODAL PEMENANG -->
  <div class="modal-overlay" id="prizeModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">
        SELAMAT! ANDA MENDAPATKAN
      </div>

      <div class="prize-img-container">
        <img
          id="modalPrizeImg"
          src=""
          alt="Gambar hadiah"
          onerror="handleImageError(this)"
        >
      </div>

      <div class="prize-name" id="modalPrizeName">KEYCHAIN</div>

      <button class="close-btn" onclick="closeModal()">
        AMBIL HADIAH
      </button>
    </div>
  </div>

  <!-- MODAL ADMIN -->
  <div class="modal-overlay" id="adminModal">
    <div class="admin-modal-content">
      <div class="admin-header">
        <h3>Kelola Hadiah Spin Wheel</h3>
        <button
          class="btn-close-admin"
          onclick="closeAdminPanel()"
          aria-label="Tutup panel admin"
        >&times;</button>
      </div>

      <div class="form-group-grid">
        <div class="form-control">
          <label for="addName">Nama Hadiah</label>
          <input type="text" id="addName" placeholder="Contoh: Running Shoes">
        </div>

        <div class="form-control">
          <label for="addQty">Stok (Qty)</label>
          <input type="number" id="addQty" min="1" value="10">
        </div>

        <div class="form-control">
          <label for="addWeight">Peluang/Win Rate (%)</label>
          <input type="number" id="addWeight" min="0.1" step="0.1" value="5">
        </div>

        <div class="form-control">
          <label for="addImg">Nama File Gambar</label>
          <input type="text" id="addImg" placeholder="Contoh: shoes.jpeg">
        </div>

        <div class="form-control">
          <label for="addColor">Warna Sektor</label>
          <input type="color" id="addColor" value="#FF6500">
        </div>

        <div class="form-control">
          <label for="addTextColor">Warna Teks</label>
          <input type="color" id="addTextColor" value="#FFFFFF">
        </div>
      </div>

      <div class="admin-actions">
        <button class="btn-add" onclick="addNewPrize()">
          + Tambah Hadiah
        </button>

        <button class="btn-reset-default" onclick="resetToDefaultData()">
          Reset ke Default
        </button>
      </div>

      <table class="prize-table">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Stok</th>
            <th>Percentage (%)</th>
            <th>Gambar</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="prizeTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // SEMUA GAMBAR DEFAULT MENGGUNAKAN .jpeg
    const defaultPrizes = [
      {
        name: "Keychain",
        qty: 100,
        weight: 85,
        color: "#1E3E62",
        textColor: "#FFFFFF",
        image: "keychain.jpeg"
      },
      {
        name: "Running Sunglasses",
        qty: 50,
        weight: 5,
        color: "#FF6500",
        textColor: "#FFFFFF",
        image: "running-sunglasses.jpeg"
      },
      {
        name: "Sports Water Bottle",
        qty: 50,
        weight: 5,
        color: "#0B192C",
        textColor: "#FFFFFF",
        image: "sports-water-bottle.jpeg"
      },
      {
        name: "Portable Sports Towel",
        qty: 50,
        weight: 5,
        color: "#1E3E62",
        textColor: "#FFFFFF",
        image: "portable-sports-towel.jpeg"
      }
    ];

    const STORAGE_KEY = "jrf_prizes_v6";

    // UBAH SEMUA EKSTENSI GAMBAR MENJADI .jpeg
    // Contoh: gambar.jpg -> gambar.jpeg
    //         gambar.png -> gambar.jpeg
    //         gambar    -> gambar.jpeg
    function normalizeImageName(filename) {
      let name = String(filename || "keychain.jpeg").trim();

      // Buang awalan path relatif
      name = name.replace(/^\.\/+/, "");

      // Ubah ekstensi gambar yang umum menjadi .jpeg
      name = name.replace(/\.(jpe?g|png|webp|gif|bmp|avif)$/i, "");

      // Pastikan tidak ada ekstensi lama yang tersisa
      name = name.replace(/\.+$/, "");

      return name + ".jpeg";
    }

    // AMBIL ELEMEN HTML
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const spinCountDisplay = document.getElementById("spinCount");
    const prizeModal = document.getElementById("prizeModal");
    const adminModal = document.getElementById("adminModal");
    const modalPrizeName = document.getElementById("modalPrizeName");
    const modalPrizeImg = document.getElementById("modalPrizeImg");

    // GAMBAR CADANGAN JIKA FILE TIDAK DITEMUKAN
    const svgFallbacks = {
      "Keychain":
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231E3E62'/><circle cx='50' cy='35' r='12' fill='none' stroke='%23FFD700' stroke-width='4'/><path d='M50 47 L50 75' stroke='%23FFD700' stroke-width='4'/><rect x='42' y='75' width='16' height='12' rx='3' fill='%23FF6500'/><text x='50' y='93' font-size='8' fill='%23FFF' text-anchor='middle' font-weight='bold'>KEYCHAIN</text></svg>",

      "Running Sunglasses":
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FF6500'/><path d='M20 45 Q50 35 80 45 L75 60 Q50 50 25 60 Z' fill='%230B192C'/><circle cx='35' cy='52' r='10' fill='%23FFD700'/><circle cx='65' cy='52' r='10' fill='%23FFD700'/><text x='50' y='85' font-size='7' fill='%23FFF' text-anchor='middle' font-weight='bold'>SUNGLASSES</text></svg>",

      "Sports Water Bottle":
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B192C'/><rect x='40' y='20' width='20' height='8' fill='%23FF6500'/><rect x='35' y='28' width='30' height='55' rx='5' fill='%231E3E62' stroke='%23FFD700' stroke-width='2'/><text x='50' y='92' font-size='7' fill='%23FFF' text-anchor='middle' font-weight='bold'>WATER BOTTLE</text></svg>",

      "Portable Sports Towel":
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231E3E62'/><rect x='25' y='30' width='50' height='45' rx='4' fill='%23FF6500'/><path d='M25 40 L75 40' stroke='%23FFD700' stroke-width='3'/><text x='50' y='88' font-size='8' fill='%23FFF' text-anchor='middle' font-weight='bold'>TOWEL</text></svg>"
    };

    // MUAT DATA LAMA DAN SERAGAMKAN NAMA FILE GAMBAR
    let storedPrizes = null;

    try {
      storedPrizes = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      console.warn("Data hadiah tersimpan tidak dapat dibaca.", error);
    }

    let prizes = Array.isArray(storedPrizes)
      ? storedPrizes
      : JSON.parse(JSON.stringify(defaultPrizes));

    prizes = prizes.map(prize => ({
      ...prize,
      color: prize.color || "#1E3E62",
      textColor: prize.textColor || "#FFFFFF",
      image: normalizeImageName(prize.image),
      qty: Number(prize.qty) || 0,
      weight: Number(prize.weight) || 5
    }));

    // COUNTER SPIN HARIAN
    const todayDate = new Date().toISOString().split("T")[0];
    const lastSpinDate = localStorage.getItem("jrf_lastSpinDate");

    let totalSpins = 0;

    if (lastSpinDate === todayDate) {
      totalSpins = parseInt(localStorage.getItem("jrf_totalSpins"), 10) || 0;
    } else {
      totalSpins = 0;
      localStorage.setItem("jrf_lastSpinDate", todayDate);
      localStorage.setItem("jrf_totalSpins", "0");
    }

    prizes = prizes.filter(prize => prize.qty > 0);

    let currentRotation = 0;
    let lastWonPrize = null;
    let isSpinning = false;
    let soundInterval = null;

    spinCountDisplay.innerText = totalSpins;

    // SIMPAN DATA
    function saveToStorage() {
      // Seragamkan kembali sebelum disimpan
      prizes = prizes.map(prize => ({
        ...prize,
        image: normalizeImageName(prize.image)
      }));

      localStorage.setItem(STORAGE_KEY, JSON.stringify(prizes));
      localStorage.setItem("jrf_totalSpins", totalSpins.toString());
      localStorage.setItem("jrf_lastSpinDate", todayDate);
    }

    // AUDIO
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContextClass ? new AudioContextClass() : null;

    function playTickSound() {
      if (!audioCtx) return;

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playWinSound() {
      if (!audioCtx) return;

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const notes = [261.63, 329.63, 392.00, 523.25];

      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = now + index * 0.1;

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.3);
      });
    }

    // PENANGANAN GAMBAR GAGAL DIMUAT
    function handleImageError(imgElement) {
      if (imgElement.dataset.fallbackUsed === "true") {
        return;
      }

      imgElement.dataset.fallbackUsed = "true";

      const prizeName = modalPrizeName.innerText.trim();
      const fallback = svgFallbacks[prizeName];

      if (fallback) {
        imgElement.src = fallback;
      } else {
        imgElement.src =
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B192C'/><text x='50' y='55' font-size='10' fill='%23FFD700' text-anchor='middle'>PRIZE</text></svg>";
      }
    }

    // GAMBAR RODA
    function drawWheel() {
      const numSlices = prizes.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) return;

      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, endAngle);
        ctx.closePath();

        ctx.fillStyle = prizes[i].color;
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = prizes[i].textColor;
        ctx.font = "bold 13px 'Montserrat', sans-serif";
        ctx.fillText(prizes[i].name, radius - 15, 5, radius - 25);
        ctx.restore();
      }
    }

    // MENENTUKAN PEMENANG BERDASARKAN BOBOT
    function getPrizeIndex() {
      if (prizes.length === 0) return -1;

      const totalWeight = prizes.reduce((sum, prize) => sum + prize.weight, 0);
      if (totalWeight <= 0) return -1;

      let randomVal = Math.random() * totalWeight;

      for (let i = 0; i < prizes.length; i++) {
        if (randomVal < prizes[i].weight) return i;
        randomVal -= prizes[i].weight;
      }

      return prizes.length - 1;
    }

    // SPIN
    function spin() {
      if (isSpinning) return;

      if (prizes.length === 0) {
        alert("Maaf, semua stok hadiah telah habis!");
        return;
      }

      const winningIndex = getPrizeIndex();

      if (winningIndex === -1) {
        alert("Maaf, semua stok hadiah telah habis!");
        return;
      }

      isSpinning = true;
      spinBtn.disabled = true;

      totalSpins++;
      spinCountDisplay.innerText = totalSpins;

      const winningPrize = prizes[winningIndex];
      winningPrize.qty--;
      lastWonPrize = winningPrize;

      saveToStorage();

      const degreesPerSlice = 360 / prizes.length;

      const targetDegree =
        360 -
        (winningIndex * degreesPerSlice) -
        (degreesPerSlice / 2) -
        90;

      const extraRounds = 360 * 6;

      const nextRotation =
        currentRotation +
        extraRounds +
        ((targetDegree - (currentRotation % 360) + 360) % 360);

      if (soundInterval) clearInterval(soundInterval);

      soundInterval = setInterval(playTickSound, 150);

      setTimeout(() => {
        if (soundInterval) clearInterval(soundInterval);
        soundInterval = setInterval(playTickSound, 300);
      }, 3000);

      setTimeout(() => {
        if (soundInterval) {
          clearInterval(soundInterval);
          soundInterval = null;
        }
      }, 4500);

      currentRotation = nextRotation;
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        if (soundInterval) {
          clearInterval(soundInterval);
          soundInterval = null;
        }

        isSpinning = false;
        spinBtn.disabled = false;

        showPrizeModal(winningPrize);
        renderPrizeTable();
      }, 5000);
    }

    // TAMPILKAN HADIAH
    function showPrizeModal(prize) {
      playWinSound();

      modalPrizeName.innerText = prize.name;
      modalPrizeImg.dataset.fallbackUsed = "false";
      modalPrizeImg.alt = prize.name;

      // Semua gambar otomatis dipanggil dengan ekstensi .jpeg
      modalPrizeImg.src = "./" + normalizeImageName(prize.image);

      prizeModal.classList.add("active");
    }

    // TUTUP POP-UP HADIAH
    function closeModal() {
      prizeModal.classList.remove("active");

      if (lastWonPrize && lastWonPrize.qty <= 0) {
        alert(
          `Perhatian: Stok hadiah "${lastWonPrize.name}" telah HABIS! Item langsung dihapus dari roda.`
        );

        prizes = prizes.filter(prize => prize.qty > 0);

        saveToStorage();
        resetWheelAnimation();
      }

      lastWonPrize = null;
    }

    // ADMIN
    function openAdminPanel() {
      const pin = prompt("Masukkan PIN Keamanan Admin:");

      if (pin === "1234") {
        renderPrizeTable();
        adminModal.classList.add("active");
      } else if (pin !== null) {
        alert("PIN Salah! Akses ditolak.");
      }
    }

    function closeAdminPanel() {
      adminModal.classList.remove("active");
    }

    // TABEL HADIAH
    function renderPrizeTable() {
      const tbody = document.getElementById("prizeTableBody");
      tbody.innerHTML = "";

      const totalWeight = prizes.reduce((sum, prize) => sum + prize.weight, 0);

      prizes.forEach((prize, index) => {
        const percentage =
          totalWeight > 0
            ? ((prize.weight / totalWeight) * 100).toFixed(1)
            : "0.0";

        const tr = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.style.textAlign = "left";

        const strong = document.createElement("strong");
        strong.textContent = prize.name;
        nameCell.appendChild(strong);

        const qtyCell = document.createElement("td");
        qtyCell.textContent = prize.qty;

        const percentageCell = document.createElement("td");
        percentageCell.textContent =
          `${percentage}% (Bobot: ${prize.weight})`;

        const imageCell = document.createElement("td");
        const imageCode = document.createElement("code");

        // Tampilkan nama file dengan ekstensi .jpeg
        imageCode.textContent = normalizeImageName(prize.image);
        imageCell.appendChild(imageCode);

        const actionCell = document.createElement("td");
        actionCell.className = "action-cell";

        const editButton = document.createElement("button");
        editButton.className = "btn-edit";
        editButton.textContent = "Edit";
        editButton.onclick = () => editPrize(index);

        const deleteButton = document.createElement("button");
        deleteButton.className = "btn-delete";
        deleteButton.textContent = "Hapus";
        deleteButton.onclick = () => removePrize(index);

        actionCell.append(editButton, deleteButton);
        tr.append(nameCell, qtyCell, percentageCell, imageCell, actionCell);
        tbody.appendChild(tr);
      });
    }

    // EDIT HADIAH
    function editPrize(index) {
      const prize = prizes[index];

      const newQtyStr = prompt(
        `Edit Stok (Qty) untuk "${prize.name}":`,
        prize.qty
      );

      if (newQtyStr === null) return;

      const newQty = Number(newQtyStr);

      if (!Number.isInteger(newQty) || newQty < 0) {
        alert("Stok harus berupa bilangan bulat 0 atau lebih!");
        return;
      }

      const newWeightStr = prompt(
        `Edit Nilai Persentase/Bobot untuk "${prize.name}":\n(Nilai lebih besar = lebih sering keluar)`,
        prize.weight
      );

      if (newWeightStr === null) return;

      const newWeight = parseFloat(newWeightStr);

      if (!Number.isFinite(newWeight) || newWeight <= 0) {
        alert("Nilai bobot harus lebih dari 0!");
        return;
      }

      const newImgStr = prompt(
        `Edit Nama File Gambar untuk "${prize.name}" (otomatis menjadi .jpeg):`,
        normalizeImageName(prize.image)
      );

      if (newImgStr !== null && newImgStr.trim() !== "") {
        prize.image = normalizeImageName(newImgStr);
      }

      prize.qty = newQty;
      prize.weight = newWeight;

      prizes = prizes.filter(item => item.qty > 0);

      saveToStorage();
      resetWheelAnimation();
    }

    // TAMBAH HADIAH
    function addNewPrize() {
      const name = document.getElementById("addName").value.trim();
      const qty = parseInt(document.getElementById("addQty").value, 10);
      const weight = parseFloat(document.getElementById("addWeight").value);
      const img = document.getElementById("addImg").value.trim();
      const color = document.getElementById("addColor").value;
      const textColor = document.getElementById("addTextColor").value;

      if (!name) {
        alert("Nama hadiah tidak boleh kosong!");
        return;
      }

      if (!Number.isInteger(qty) || qty <= 0) {
        alert("Stok harus berupa bilangan bulat lebih dari 0!");
        return;
      }

      if (!Number.isFinite(weight) || weight <= 0) {
        alert("Bobot harus berupa angka lebih dari 0!");
        return;
      }

      prizes.push({
        name,
        qty,
        weight,
        color,
        textColor,
        image: normalizeImageName(img || "keychain.jpeg")
      });

      document.getElementById("addName").value = "";
      document.getElementById("addQty").value = "10";
      document.getElementById("addWeight").value = "5";
      document.getElementById("addImg").value = "";

      saveToStorage();
      resetWheelAnimation();
    }

    // HAPUS HADIAH
    function removePrize(index) {
      if (
        confirm(
          `Apakah Anda yakin ingin menghapus "${prizes[index].name}" dari roda spin?`
        )
      ) {
        prizes.splice(index, 1);
        saveToStorage();
        resetWheelAnimation();
      }
    }

    // RESET DATA DEFAULT
    function resetToDefaultData() {
      if (
        confirm(
          "Apakah Anda yakin ingin mereset seluruh hadiah dan counter spin ke data awal?"
        )
      ) {
        prizes = JSON.parse(JSON.stringify(defaultPrizes));
        totalSpins = 0;

        spinCountDisplay.innerText = totalSpins;

        localStorage.removeItem(STORAGE_KEY);
        saveToStorage();
        resetWheelAnimation();
      }
    }

    // RESET RODA
    function resetWheelAnimation() {
      canvas.style.transition = "none";
      canvas.style.transform = "rotate(0deg)";
      currentRotation = 0;

      void canvas.offsetHeight;

      canvas.style.transition =
        "transform 5s cubic-bezier(0.15, 0.99, 0.35, 1)";

      drawWheel();
      renderPrizeTable();
    }

    // TUTUP MODAL JIKA AREA LUAR DIKLIK
    prizeModal.addEventListener("click", function(event) {
      if (event.target === prizeModal) {
        closeModal();
      }
    });

    adminModal.addEventListener("click", function(event) {
      if (event.target === adminModal) {
        closeAdminPanel();
      }
    });

    // SIMPAN NAMA FILE YANG SUDAH DINORMALISASI
    saveToStorage();

    // MULAI APLIKASI
    drawWheel();
    renderPrizeTable();
  </script>
</body>
</html>
